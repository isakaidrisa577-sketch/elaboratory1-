<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no" />
  <title>Android AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        Roboto,
        -apple-system,
        sans-serif;
      -webkit-tap-highlight-color:
        transparent;
    }

    body {
      background-color: #121316;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Android Phone Frame */
    .phone-container {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 890px;
      background: #1b1b1f;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 480px) {
      .phone-container {
        border-radius: 28px;
        box-shadow: 0 10px 40px
          rgba(0, 0, 0, 0.6);
        border: 4px solid #2d2f34;
        height: 92vh;
      }
    }

    /* Android Top Bar */
    .status-bar {
      height: 28px;
      background: #1b1b1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 12px;
      color: #c4c7c5;
      font-weight: 500;
    }

    /* App Bar */
    .app-bar {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: #22242a;
      border-bottom: 1px solid #33353b;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #a8c7fa,
        #0b57d0
      );
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #040e1e;
      margin-right: 12px;
      font-size: 18px;
    }

    .info h2 {
      font-size: 16px;
      color: #e3e3e3;
      font-weight: 600;
    }

    .info p {
      font-size: 12px;
      color: #7dd08a;
    }

    /* Chat Messages Box */
    .chat-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.45;
      border-radius: 18px;
      word-break: break-word;
    }

    .user-msg {
      align-self: flex-end;
      background: #d3e3fd;
      color: #041e49;
      border-bottom-right-radius: 4px;
    }

    .bot-msg {
      align-self: flex-start;
      background: #2d2f34;
      color: #e3e3e3;
      border-bottom-left-radius: 4px;
    }

    /* Bottom Input Bar */
    .input-box {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #1b1b1f;
      gap: 8px;
    }

    .input-field {
      flex: 1;
      background: #282a2f;
      border: 1px solid #3d4046;
      border-radius: 24px;
      padding: 12px 18px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .input-field::placeholder {
      color: #8e918f;
    }

    .input-field:focus {
      border-color: #a8c7fa;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #a8c7fa;
      color: #041e49;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .send-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- Android Status Bar -->
    <div class="status-bar">
      <span>12:00</span>
      <span>5G 98%</span>
    </div>

    <!-- App Header -->
    <header class="app-bar">
      <div class="avatar">AI</div>
      <div class="info">
        <h2>Android AI</h2>
        <p>Online</p>
      </div>
    </header>

    <!-- Chat Stream -->
    <div class="chat-area" id="chatArea">
      <div class="message bot-msg">
        Hello! I am your Android AI.
        How can I help you today?
      </div>
    </div>

    <!-- User Input -->
    <div class="input-box">
      <input
        type="text"
        id="userInput"
        class="input-field"
        placeholder="Ask something..."
        autocomplete="off"
      />
      <button
        class="send-btn"
        id="sendBtn"
        onclick="sendMessage()">
        ➤
      </button>
    </div>
  </div>

  <script>
    const chat =
      document.getElementById("chatArea");
    const input =
      document.getElementById("userInput");

    input.addEventListener(
      "keydown",
      function (e) {
        if (e.key === "Enter") {
          sendMessage();
        }
      }
    );

    function addMessage(text, isUser) {
      const msg =
        document.createElement("div");
      msg.className =
        "message " +
        (isUser ? "user-msg" : "bot-msg");
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function getLocalAIResponse(query) {
      const q = query.toLowerCase();

      if (q.includes("hello") ||
          q.includes("hi")) {
        return "Hello! What can I build" +
               " or solve for you today?";
      }
      if (q.includes("time")) {
        return "Current time is: " +
          new Date().toLocaleTimeString();
      }
      if (q.includes("name")) {
        return "I am your Android AI" +
               " companion.";
      }
      if (q.includes("joke")) {
        return "Why do programmers wear" +
          " glasses? Because they can't C#!";
      }

      // Simple math evaluation
      try {
        if (/^[\d\s\+\-\*\/\(\)\.]+$/
            .test(q)) {
          return "Result: " + eval(q);
        }
      } catch (e) {}

      return "I processed: '" + query +
        "'. You can connect my script" +
        " to any LLM API!";
    }

    function sendMessage() {
      const query = input.value.trim();
      if (!query) return;

      // 1. Show user message
      addMessage(query, true);
      input.value = "";

      // 2. Simulate AI response delay
      setTimeout(() => {
        const reply =
          getLocalAIResponse(query);
        addMessage(reply, false);
      }, 500);
    }
  </script>
</body>
</html
